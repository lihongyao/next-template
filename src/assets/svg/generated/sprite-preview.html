<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite 图标预览</title>
    <style>
      body { margin: 0; padding: 24px; background: #0f1115; color: #e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      .desc { margin: 0 0 16px; color: #9ca3af; font-size: 13px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
      .item { border: 1px solid #242833; border-radius: 10px; background: #171a21; padding: 12px; text-align: center; }
      .icon-wrap { width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 8px; background: #0f1115; display: flex; align-items: center; justify-content: center; }
      .icon { width: 24px; height: 24px; color: #60a5fa; fill: currentColor; }
      code { font-size: 12px; color: #cbd5e1; word-break: break-all; }
      .empty { color: #9ca3af; }
    </style>
  </head>
  <body>
    <h1>Sprite 图标预览</h1>
    <p class="desc">当前 sprite：<code>/sprite.7e6d380b.svg</code></p>
    <ul>
      <li class="item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <use href="/sprite.7e6d380b.svg#icon-cart"></use>
          </svg>
        </div>
        <code>cart</code>
      </li>

      <li class="item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <use href="/sprite.7e6d380b.svg#icon-home"></use>
          </svg>
        </div>
        <code>home</code>
      </li>

      <li class="item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <use href="/sprite.7e6d380b.svg#icon-order"></use>
          </svg>
        </div>
        <code>order</code>
      </li>

      <li class="item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <use href="/sprite.7e6d380b.svg#icon-profile"></use>
          </svg>
        </div>
        <code>profile</code>
      </li>

      <li class="item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <use href="/sprite.7e6d380b.svg#icon-xxx"></use>
          </svg>
        </div>
        <code>xxx</code>
      </li></ul>
  </body>
</html>
